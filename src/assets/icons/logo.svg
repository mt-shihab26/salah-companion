<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="oklch(0.6132 0.2294 291.7437)"/>
      <stop offset="100%" stop-color="oklch(0.4 0.2713 286.7462)"/>
    </linearGradient>
    <mask id="moon-mask">
      <rect width="100" height="100" fill="white"/>
      <circle cx="58" cy="28" r="14" fill="black"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Crescent moon -->
  <circle cx="50" cy="32" r="17" fill="oklch(1 0 0)" opacity="0.95" mask="url(#moon-mask)"/>

  <!-- 4-pointed star -->
  <path d="M 67 16.5 L 68.5 18.5 L 70.5 20 L 68.5 21.5 L 67 23.5 L 65.5 21.5 L 63.5 20 L 65.5 18.5 Z"
        fill="oklch(1 0 0)" opacity="0.9"/>

  <!-- Open book — left page -->
  <path d="M 46 57 L 18 61 L 18 86 L 46 82 Z" fill="oklch(1 0 0)" opacity="0.92"/>
  <!-- Open book — right page -->
  <path d="M 54 57 L 82 61 L 82 86 L 54 82 Z" fill="oklch(1 0 0)" opacity="0.72"/>
  <!-- Spine -->
  <path d="M 46 57 L 54 57 L 54 82 L 46 82 Z" fill="oklch(1 0 0)" opacity="0.12"/>

  <!-- Text lines on left page -->
  <line x1="22" y1="67" x2="42" y2="66" stroke="oklch(0.4 0.2713 286.7462)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="22" y1="72" x2="42" y2="71" stroke="oklch(0.4 0.2713 286.7462)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="22" y1="77" x2="35" y2="76" stroke="oklch(0.4 0.2713 286.7462)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>
